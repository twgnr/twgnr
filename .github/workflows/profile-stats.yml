name: Profile stats

# Refreshes assets/stats.svg and assets/top-langs.svg so the README never
# depends on a third-party image service being up.

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch: # lets you trigger it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/build-stats.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the rebase-free retry below can push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build cards
        env:
          # STATS_TOKEN is a classic PAT with `repo` + `read:user`; it makes the
          # private repositories count too. Without it the built-in token is
          # used and the cards only reflect public activity.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build-stats.mjs

      - name: Commit if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The cards are build output, so this run's version always wins. Keep
          # a copy aside: if the remote moved while we were building, we replay
          # it onto the new tip instead of merging two generated SVGs.
          mkdir -p "$RUNNER_TEMP/cards"
          cp assets/stats.svg assets/top-langs.svg "$RUNNER_TEMP/cards/"

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/cards/stats.svg" "$RUNNER_TEMP/cards/top-langs.svg" assets/
            git add assets/stats.svg assets/top-langs.svg

            if git diff --staged --quiet; then
              echo "cards unchanged"
              exit 0
            fi

            git commit -m "chore: refresh profile stats"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt - remote moved, replaying"
          done

          echo "could not push after 3 attempts"
          exit 1
