<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" fill="none" role="img" aria-label="Tobias Wagner">
  <defs>
    <radialGradient id="hGlowC" cx="170" cy="0" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#47C2FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#47C2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hGlowI" cx="1200" cy="210" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7D8CFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7D8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hVig" cx="600" cy="88" r="740" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#05080F" stop-opacity="0"/>
      <stop offset="1" stop-color="#05080F" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="hGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#94B4DC" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>
    <filter id="deep" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="hglow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hclip">
      <path d="M0 0 H1200 V165 Q 1140 181 1080 165 T 960 165 T 840 165 T 720 165 T 600 165 T 480 165 T 360 165 T 240 165 T 120 165 T 0 165 Z"/>
    </clipPath>
  </defs>

  <!-- dark blue banner, slightly transparent, with a wavy bottom edge -->
  <path d="M0 0 H1200 V165 Q 1140 181 1080 165 T 960 165 T 840 165 T 720 165 T 600 165 T 480 165 T 360 165 T 240 165 T 120 165 T 0 165 Z" fill="#0A101D" fill-opacity="0.88"/>

  <g clip-path="url(#hclip)">
    <!-- soft glows + faint grid, like the card backdrops -->
    <rect x="0" y="0" width="1200" height="210" fill="url(#hGlowC)"/>
    <rect x="0" y="0" width="1200" height="210" fill="url(#hGlowI)"/>
    <rect x="0" y="0" width="1200" height="210" fill="url(#hGrid)"/>

    <!-- DEPTH: blurred traces receding into the background -->
    <g filter="url(#deep)" stroke-width="2" fill="none" stroke-linecap="square">
      <path d="M-20 84 H250 V120 H540 V82 H840 V120 H1120 V88 H1220" stroke="#6E8BFF" opacity="0.18"/>
      <path d="M140 -10 V64 H380 V24" stroke="#47C2FF" opacity="0.14"/>
      <path d="M880 -10 V58 H1120 V112" stroke="#7D8CFF" opacity="0.14"/>
    </g>

    <!-- foreground circuit traces (sharp) -->
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.20" stroke-linecap="square" fill="none">
      <path d="M-20 30 H170 V50 H360 V30 H540 V50 H740 V30 H960 V52 H1220"/>
      <path d="M-20 140 H180 V122 H400 V142 H640 V124 H880 V142 H1100 V126 H1220"/>
      <path d="M110 30 V10 H250"/>
      <path d="M1050 52 V152"/>
      <path d="M150 140 V182"/>
    </g>
    <!-- thin light pulses, a gentle glow -->
    <g stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" filter="url(#hglow)" fill="none" opacity="0.9">
      <path d="M-20 30 H170 V50 H360 V30 H540 V50 H740 V30 H960 V52 H1220" stroke-dasharray="7 493">
        <animate attributeName="stroke-dashoffset" values="0;-500" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M-20 140 H180 V122 H400 V142 H640 V124 H880 V142 H1100 V126 H1220" stroke-dasharray="7 493">
        <animate attributeName="stroke-dashoffset" values="0;-500" dur="1.75s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke="#47C2FF" stroke-width="1.4">
      <g transform="translate(360 30)"><rect x="-4" y="-4" width="8" height="8" rx="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(740 30)"><rect x="-4" y="-4" width="8" height="8" rx="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(400 142)"><rect x="-4" y="-4" width="8" height="8" rx="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(880 142)"><rect x="-4" y="-4" width="8" height="8" rx="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1s" repeatCount="indefinite"/></rect></g>
    </g>

    <!-- DEPTH: vignette recedes the edges -->
    <rect x="0" y="0" width="1200" height="210" fill="url(#hVig)"/>
    <!-- DEPTH: lit top edge (bevel) -->
    <rect x="0" y="0" width="1200" height="1.5" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="600" y="86" font-size="46" font-weight="700" letter-spacing="1">Tobias Wagner</text>
    <text x="600" y="116" font-size="15" font-weight="500" opacity="0.86" letter-spacing="2">Software Engineer &#183; Oracle Specialist &#183; Audio Developer &#183; EDM Producer</text>
  </g>
</svg>
